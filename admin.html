<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление сайтом — Искусство Разума</title><link rel="stylesheet" href="css/style.css"><style>body{padding:24px;max-width:1000px;margin:auto}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin:18px 0}.field{display:grid;gap:6px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px}textarea{min-height:90px}button{cursor:pointer}.hidden{display:none}.course{border-top:1px solid #ddd;padding-top:14px;margin-top:14px}</style></head><body><h1>Панель управления сайтом</h1><p>Изменения сохраняются в репозиторий GitHub и публикуются после обновления GitHub Pages.</p><section id="login" class="panel"><div class="field"><label>Адрес Cloudflare Worker</label><input id="api" placeholder="https://your-worker.workers.dev"></div><div class="field"><label>Тип доступа</label><select id="role"><option value="admin">Руководитель</option><option value="developer">Разработчик</option></select></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Войти</button><p id="loginMsg"></p></section><section id="editor" class="panel hidden"><h2>Программы и цены</h2><div id="courses"></div><button id="saveBtn">Сохранить изменения</button><p id="msg"></p><button id="logoutBtn">Выйти</button></section><script>
let api='',authToken='',content={};const $=id=>document.getElementById(id);function field(label,key,value,area=false){return `<label class="field">${label}${area?`<textarea data-key="${key}">${esc(value||'')}</textarea>`:`<input data-key="${key}" value="${esc(value||'')}">`}</label>`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('loginBtn').onclick=async()=>{api=$('api').value.trim().replace(/\/$/,'');if(!api){$('loginMsg').textContent='Укажите URL Worker.';return}try{let r=await fetch(api+'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role:$('role').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.message||'Ошибка входа');authToken=d.token;let cr=await fetch(api+'/api/content',{headers:{authorization:'Bearer '+authToken}});content=await cr.json();if(!cr.ok)throw Error(content.message||'Не удалось загрузить данные');$('login').classList.add('hidden');$('editor').classList.remove('hidden');render();}catch(e){$('loginMsg').textContent=e.message}};
function render(){const host=$('courses');host.innerHTML='';for(const [key,c] of Object.entries(content.courses||{})){const div=document.createElement('div');div.className='course';div.innerHTML=`<h3>${esc(key)}</h3>${field('Название','title',c.title)}${field('Описание','description',c.description,true)}${field('Цена','price',c.price)}${field('Путь или HTTPS-ссылка на изображение','image',c.image)}`;div.querySelectorAll('[data-key]').forEach(el=>el.dataset.course=key);host.appendChild(div)}}
$('saveBtn').onclick=async()=>{document.querySelectorAll('[data-key]').forEach(el=>{content.courses[el.dataset.course][el.dataset.key]=el.value.trim()});try{let r=await fetch(api+'/api/content',{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(content)});let d=await r.json();if(!r.ok)throw Error(d.message||'Ошибка сохранения');$('msg').textContent=d.message}catch(e){$('msg').textContent=e.message}};$('logoutBtn').onclick=()=>{authToken='';$('editor').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';};</script></body></html>
